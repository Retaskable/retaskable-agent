# docs/specs/agent-ci.md section 6: the CI runner in its own container, for a computer whose agent runs in Docker
# (that container has no Docker, so it runs no CI). One service checks every repo in AGENT_CI_REPO. Only this
# container has the Docker socket: the agent's sessions never reach it.
#
# Start the published image (RETASKABLE_VERSION, e.g. 0.1.1, default latest) with `up -d` and no `--build`, or build and
# start from a checkout of the commit to approve:
#   AGENT_CI_NAME=<this computer> CI_RUST_COMMIT=$(git rev-parse HEAD) docker compose -f docker/ci/compose.yaml up -d --build
#   docker compose -f docker/ci/compose.yaml logs -f
# The GitHub token is saved once, not passed: `docker compose -f docker/ci/compose.yaml run --rm ci retaskable-ci secret set GH_TOKEN`.
#
# Once per computer, before it merges or shows on the board, link it to the store (role ci; see README.md here):
#   docker compose -f docker/ci/compose.yaml run --rm ci retaskable-ci link
#
# Set DOCKER_GID to the Docker socket's group (the runner runs as uid 1000, not root, so it can share the data volume
# with the agent): `export DOCKER_GID=$(stat -c %g /var/run/docker.sock)`.
#
# Docker Desktop on Windows (WSL): set DOCKER_SOCK=/var/run/docker.sock.raw and DOCKER_GID=0. From a WSL shell the
# default /var/run/docker.sock is the distro's proxy, so the container mounts a path inside that distro; after a reboot
# Docker starts before the distro, the path isn't there, the container fails to start and `restart: unless-stopped`
# never retries it (even Start in Docker Desktop fails until a WSL shell is opened). docker.sock.raw is Docker
# Desktop's own socket in its VM (owned by root:root, hence group 0), there from the moment Docker is. Both compose files mount the one volume
# `retaskable-data`, so the agent's settings page (docker/agent) manages this runner too; docs/specs/docker.md
# section 3.1. An older `retaskable-ci_data` volume is copied in once (docker/ci/README.md, "Moving to the shared
# volume").
name: retaskable-ci

services:
  ci:
    image: ghcr.io/retaskable/retaskable-ci:${RETASKABLE_VERSION:-latest}
    build:
      context: ../..
      dockerfile: docker/ci/Dockerfile
      args:
        CI_RUST_COMMIT: ${CI_RUST_COMMIT:-unknown}
    container_name: retaskable-ci
    restart: unless-stopped
    # uid 1000 is the agent's `node`; the socket's group comes from the host.
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the Docker socket group id, see the top of this file}"
    command: ["retaskable-ci", "run", "--settings-port", "4702"]
    ports:
      # The host's 127.0.0.1 only: never another address (agent-settings.md section 4.4).
      - "127.0.0.1:4702:4702"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - data:/data
    environment:
      # Optional: save it instead with `retaskable-ci secret set GH_TOKEN` (README.md here), sealed in the data volume.
      GH_TOKEN: ${GH_TOKEN:-}
      # docs/specs/docker.md section 7: the page listens on 0.0.0.0 inside the container, and the container's gateway
      # (the host, through the 127.0.0.1-only publish above) counts as this computer.
      RETASKABLE_TRUST_DOCKER_HOST: "1"
      # The name its statuses and containers carry: the computer's.
      AGENT_CI_NAME: ${AGENT_CI_NAME:?set AGENT_CI_NAME (this computer's name, e.g. its hostname)}
      AGENT_CI_SLOTS: ${AGENT_CI_SLOTS:-4}
      AGENT_CI_CPUS: ${AGENT_CI_CPUS:-8}
      AGENT_CI_REPO: ${AGENT_CI_REPO:-Retaskable/Retaskable.com,Retaskable/retaskable-agent}

volumes:
  data:
    # The same volume as docker/agent/compose.yaml's, under the same name, whichever project makes it first.
    name: retaskable-data
