# Publishes the Docker images to GHCR (docs/specs/docker.md): docker/agent/compose.yaml and docker/ci/compose.yaml
# pull them by default. No secret is baked in: the Dockerfiles copy only source, and secrets are saved at run time.
#
# Runs when a `v*` tag is pushed, or by hand (the image is then tagged with the ref name it runs on).
name: images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: retaskable-agent, dockerfile: docker/agent/Dockerfile, title: Retaskable agent, description: The Retaskable agent in a Linux container, build_args: "" }
          - { image: retaskable-ci, dockerfile: docker/ci/Dockerfile, title: Retaskable CI runner, description: The Retaskable CI runner in a container, build_args: "CI_RUST_COMMIT=${{ github.sha }}" }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/retaskable/${{ matrix.image }}
          # v1.2.3 -> 1.2.3 and latest; a hand run on a branch gets the branch name, never latest.
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.url=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
