# The repo's checks on Woodpecker (ci.jcnash.dnsalias.com), on Linux: every pull request and every push to main.
# Woodpecker reports to GitHub as the `ci/woodpecker/pr/ci` status, which Retaskable's agent reads with the other
# checks. The repo's only CI: no GitHub Actions (2026-10-29, the human: no GitHub minutes), so Windows and macOS
# aren't built or tested here; win-x64 and mac-* are checked on those machines until a runner of their own joins.

when:
  - event: pull_request
    branch: main
  - event: push
    branch: main

steps:
  - name: check
    image: rust:1-bookworm
    environment: &cargo_env
      CARGO_TERM_COLOR: always
      # The crates and the build kept on the runner (the repo is trusted for volumes, 2026-10-29), so a run compiles
      # only what changed. Cargo locks the build folder, so two runs at once take turns rather than clash.
      CARGO_TARGET_DIR: /cargo-target
      # That same target dir's incremental cache is shared by every run, forever: once one entry in it goes bad,
      # rustc/clippy-driver segfaults reusing it on every run after, with nothing wrong in the source (2026-10-30,
      # pipelines 111 and 116, a SIGSEGV compiling src/lib.rs that cargo check/clippy/test don't reproduce locally
      # on an unshared target dir with the same toolchain). Incremental only pays off for a local edit/rebuild loop
      # anyway, not a one-shot CI run, so it's off here rather than reused.
      CARGO_INCREMENTAL: "0"
      # Pipeline 119's bundle step then segfaulted twice in one build, in two unrelated crates and two unrelated
      # parts of the compiler (macro expansion, then LLVM's register allocator codegening another crate): several
      # heavy crates' rustc/LLVM were running at once (cargo's default, one per core) on a box too tight on memory
      # for that many at a time, especially for bundle's release build. One rustc/LLVM at a time costs build time,
      # not memory, so cap it instead of hoping the box grows more room.
      CARGO_BUILD_JOBS: "1"
    volumes: &cargo_volumes
      - /var/cache/woodpecker/retaskable-agent-cargo-registry:/usr/local/cargo/registry
      # -target-2: pipelines 134 and 136 (2026-10-30) still segfaulted compiling retaskable_agent's own
      # lib.rs with CARGO_INCREMENTAL=0 already set, and a plain retrigger (no code change) didn't clear
      # it either. CARGO_INCREMENTAL=0 only disables the incremental cache, not the cached, already-built
      # dependency artifacts the shared target dir keeps regardless — one of those going bad outlives
      # incremental being off. Couldn't reproduce either crash on a clean target dir with the pinned
      # toolchain (rust:1-bookworm, including under a tight 900MB memory cap, which rules out the box
      # just being short on RAM), so the fix is a fresh cache path rather than a fix to the source.
      - /var/cache/woodpecker/retaskable-agent-target-2:/cargo-target
    commands:
      - rustup component add rustfmt clippy
      - cargo fmt --check
      - cargo clippy --all-targets -- -D warnings
      - cargo test

  # installers/03-the-bundle-agent-bundle.md sections 3.9 and 3.10: linux-x64 built and start-checked. On a push to
  # main, or a pull request that changes how it's built.
  - name: bundle
    image: rust:1-bookworm
    depends_on: [check]
    environment: *cargo_env
    volumes: *cargo_volumes
    when:
      - event: push
      - event: pull_request
        path:
          include: [src/bin/bundle.rs, "src/release*.rs", "src/release*/**", Cargo.toml, Cargo.lock, .woodpecker/ci.yaml]
    commands:
      - cargo run --release --bin bundle
