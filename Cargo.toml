[package]
name = "retaskable-agent"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
default-run = "retaskable"

[lib]
name = "retaskable_agent"
path = "src/lib.rs"

# `retaskable.exe`/`retaskable` (installers/03-the-bundle-agent-bundle.md section 3.1), not the
# package's own `retaskable-agent`.
[[bin]]
name = "retaskable"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
base64 = "0.22.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
gethostname = { version = "1.1.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyring = "4"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scrypt = { version = "0.12.0", default-features = false, features = ["kdf"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3", default-features = false, features = ["formatting", "std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "io-util", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
