[package]
name = "retaskable-agent"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
default-run = "retaskable"

[lib]
name = "retaskable_agent"
path = "src/lib.rs"

# `retaskable.exe`/`retaskable` (installers/03-the-bundle-agent-bundle.md section 3.1), not the
# package's own `retaskable-agent`.
[[bin]]
name = "retaskable"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "alloc", "std"] }
gethostname = { version = "1.1.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyring = "4"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
scrypt = { version = "0.12.0", default-features = false, features = ["kdf"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
time = { version = "0.3", default-features = false, features = ["formatting", "std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "io-util", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

# Line tables only, not full debug info: CI's check step (clippy and test, both built with this
# profile) has repeatedly SIGSEGV'd in LLVM finalizing full (level 2) debug info for this crate's
# test build, the project's single largest compilation unit once every #[cfg(test)] fn across the
# whole crate is included. Line tables still carry file:line for panics and backtraces; only the
# much larger per-variable/per-type debug metadata is dropped.
[profile.dev]
debug = "line-tables-only"
